services:
  app:
    image: jluai:local
    build:
      context: .
      args:
        NEXT_PUBLIC_CAMPUS: ${NEXT_PUBLIC_CAMPUS:-jlu}
        NEXT_PUBLIC_QQ_GROUP_URL: ${NEXT_PUBLIC_QQ_GROUP_URL:-}
    init: true
    restart: unless-stopped
    ports:
      - "127.0.0.1:${PORT:-3000}:3000"
    environment:
      TZ: Asia/Shanghai
    volumes:
      - data:/app/data
      - backups:/app/backups
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  data:
  backups:
